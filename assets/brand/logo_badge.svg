<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <path id="textCircle" d="M 256, 256 m -180, 0 a 180,180 0 1,1 360,0 a 180,180 0 1,1 -360,0" fill="none"/>
  </defs>

  <!-- Outer Ring with Gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#badgeBg)" stroke="url(#ringGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#1A2238" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Center Symbol Base -->
  <rect x="156" y="156" width="200" height="200" rx="52" fill="#8B5CF6"/>
  <!-- Play Icon -->
  <path d="M236 214C236 209.5 241 206.5 245 209L295 240C299 242.5 299 248.5 295 251L245 282C241 284.5 236 281.5 236 277V214Z" fill="#F8FAFC"/>
  <!-- Pulse Line -->
  <path d="M190 264H212L222 242L238 288L256 220L272 264H322" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top / Bottom Circular Texts -->
  <text fill="#F8FAFC" font-size="21" font-family="Space Grotesk, sans-serif" font-weight="700" letter-spacing="9">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      CINEPULSE • ENTERTAINMENT
    </textPath>
  </text>
  <text fill="#94A3B8" font-size="16" font-family="Inter, sans-serif" font-weight="600" letter-spacing="7">
    <textPath href="#textCircle" startOffset="0%" text-anchor="middle">
      ASSISTA • AVALIE • CONECTE
    </textPath>
  </text>
</svg>
