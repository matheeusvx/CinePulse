<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <linearGradient id="homeBg" x1="195" y1="0" x2="195" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="40%" stop-color="#090D18"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="350" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentBtn" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="poster1" x1="0" y1="0" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="poster2" x1="0" y1="0" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="poster3" x1="0" y1="0" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect width="390" height="844" rx="44"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screenClip)">
    <!-- Base Background -->
    <rect width="390" height="844" fill="url(#homeBg)"/>

    <!-- Status Bar -->
    <text x="36" y="38" fill="#F8FAFC" font-size="14" font-family="Inter, sans-serif" font-weight="600">09:41</text>
    <g transform="translate(320, 26)">
      <path d="M0 12h3V8H0v4zm5 0h3V5H5v7zm5 0h3V2h-3v10zm5 0h3V0h-3v12z" fill="#F8FAFC"/>
      <rect x="22" y="2" width="22" height="11" rx="3" stroke="#F8FAFC" stroke-width="1.5" fill="none"/>
      <rect x="24" y="4" width="14" height="7" rx="1.5" fill="#22D3EE"/>
      <path d="M45 5.5v4" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Top App Bar -->
    <g transform="translate(20, 56)">
      <!-- Logo Symbol small -->
      <rect width="34" height="34" rx="10" fill="#8B5CF6"/>
      <path d="M14 11L22 17L14 23Z" fill="#F8FAFC"/>
      <path d="M8 20H11L13 16L15 22L17 14L19 20H26" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/>
      
      <text x="44" y="23" fill="#F8FAFC" font-size="20" font-family="Space Grotesk, sans-serif" font-weight="700">CinePulse</text>

      <!-- Notification Bell -->
      <circle cx="330" cy="17" r="18" fill="#121829" stroke="#1A2238" stroke-width="1"/>
      <path d="M330 10a4 4 0 0 0-4 4v3l-1.5 2h11l-1.5-2v-3a4 4 0 0 0-4-4zm-1.5 10a1.5 1.5 0 0 0 3 0h-3z" fill="#94A3B8"/>
      <circle cx="335" cy="11" r="3.5" fill="#22D3EE"/>
    </g>

    <!-- Search Field -->
    <g transform="translate(20, 106)">
      <rect width="350" height="46" rx="16" fill="#121829" stroke="#1A2238" stroke-width="1"/>
      <circle cx="24" cy="23" r="6" stroke="#94A3B8" stroke-width="1.8" fill="none"/>
      <path d="M28.5 27.5L34 33" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="44" y="28" fill="#64748B" font-size="14" font-family="Inter, sans-serif">Buscar filmes, séries ou amigos...</text>
    </g>

    <!-- Hero Banner (Proposta de Valor) -->
    <g transform="translate(20, 166)">
      <rect width="350" height="135" rx="20" fill="url(#heroGrad)" stroke="#312E81" stroke-width="1.2"/>
      
      <!-- Cyan Glow inside banner -->
      <circle cx="320" cy="30" r="50" fill="#22D3EE" opacity="0.15" filter="blur(20px)"/>
      
      <rect x="18" y="18" width="88" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.25"/>
      <text x="26" y="33" fill="#C4B5FD" font-size="11" font-family="Inter, sans-serif" font-weight="700">PULSE MATCH</text>

      <text x="18" y="65" fill="#F8FAFC" font-size="17" font-family="Space Grotesk, sans-serif" font-weight="700">Seu gosto além das notas.</text>
      <text x="18" y="85" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif">Avalie por história, visual, trilha e atuação.</text>

      <g transform="translate(18, 97)">
        <rect width="115" height="26" rx="13" fill="url(#accentBtn)"/>
        <text x="16" y="17" fill="#FFFFFF" font-size="11" font-family="Inter, sans-serif" font-weight="700">Explorar Títulos</text>
      </g>
    </g>

    <!-- MoodTags Section -->
    <g transform="translate(20, 318)">
      <text x="0" y="18" fill="#F8FAFC" font-size="16" font-family="Space Grotesk, sans-serif" font-weight="700">Para o seu humor</text>
      <text x="350" y="17" text-anchor="end" fill="#8B5CF6" font-size="12" font-family="Inter, sans-serif" font-weight="600">Ver todas</text>

      <!-- Chips list -->
      <g transform="translate(0, 30)">
        <!-- Chip 1: Selected / Glow -->
        <rect x="0" y="0" width="88" height="34" rx="17" fill="#1A2238" stroke="#22D3EE" stroke-width="1.5"/>
        <text x="16" y="21" fill="#22D3EE" font-size="12" font-family="Inter, sans-serif" font-weight="600">⚡ Tenso</text>

        <!-- Chip 2 -->
        <rect x="96" y="0" width="82" height="34" rx="17" fill="#121829" stroke="#1A2238" stroke-width="1"/>
        <text x="110" y="21" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif" font-weight="500">☕ Leve</text>

        <!-- Chip 3 -->
        <rect x="186" y="0" width="104" height="34" rx="17" fill="#121829" stroke="#1A2238" stroke-width="1"/>
        <text x="198" y="21" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif" font-weight="500">💡 Reflexivo</text>

        <!-- Chip 4 -->
        <rect x="298" y="0" width="100" height="34" rx="17" fill="#121829" stroke="#1A2238" stroke-width="1"/>
        <text x="310" y="21" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif" font-weight="500">🔥 Épico</text>
      </g>
    </g>

    <!-- Em Alta na Comunidade -->
    <g transform="translate(20, 400)">
      <text x="0" y="18" fill="#F8FAFC" font-size="16" font-family="Space Grotesk, sans-serif" font-weight="700">Em alta na comunidade</text>
      
      <!-- Posters row -->
      <g transform="translate(0, 30)">
        <!-- Movie Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="106" height="152" rx="14" fill="url(#poster1)" stroke="#312E81" stroke-width="1"/>
          <!-- Rating badge -->
          <rect x="8" y="8" width="46" height="20" rx="10" fill="#090D18" fill-opacity="0.85"/>
          <text x="14" y="22" fill="#FBBF24" font-size="11" font-family="Inter, sans-serif" font-weight="700">★ 4.8</text>
          
          <rect x="8" y="105" width="90" height="38" rx="8" fill="#090D18" fill-opacity="0.9"/>
          <text x="14" y="121" fill="#F8FAFC" font-size="11" font-family="Space Grotesk, sans-serif" font-weight="700">Duna 2</text>
          <text x="14" y="135" fill="#22D3EE" font-size="9" font-family="Inter, sans-serif" font-weight="600">96% Pulse</text>
        </g>

        <!-- Movie Card 2 -->
        <g transform="translate(122, 0)">
          <rect width="106" height="152" rx="14" fill="url(#poster2)" stroke="#115E59" stroke-width="1"/>
          <rect x="8" y="8" width="46" height="20" rx="10" fill="#090D18" fill-opacity="0.85"/>
          <text x="14" y="22" fill="#FBBF24" font-size="11" font-family="Inter, sans-serif" font-weight="700">★ 4.6</text>
          
          <rect x="8" y="105" width="90" height="38" rx="8" fill="#090D18" fill-opacity="0.9"/>
          <text x="14" y="121" fill="#F8FAFC" font-size="11" font-family="Space Grotesk, sans-serif" font-weight="700">Severance</text>
          <text x="14" y="135" fill="#22D3EE" font-size="9" font-family="Inter, sans-serif" font-weight="600">92% Pulse</text>
        </g>

        <!-- Movie Card 3 -->
        <g transform="translate(244, 0)">
          <rect width="106" height="152" rx="14" fill="url(#poster3)" stroke="#831843" stroke-width="1"/>
          <rect x="8" y="8" width="46" height="20" rx="10" fill="#090D18" fill-opacity="0.85"/>
          <text x="14" y="22" fill="#FBBF24" font-size="11" font-family="Inter, sans-serif" font-weight="700">★ 4.9</text>
          
          <rect x="8" y="105" width="90" height="38" rx="8" fill="#090D18" fill-opacity="0.9"/>
          <text x="14" y="121" fill="#F8FAFC" font-size="11" font-family="Space Grotesk, sans-serif" font-weight="700">Interestelar</text>
          <text x="14" y="135" fill="#22D3EE" font-size="9" font-family="Inter, sans-serif" font-weight="600">98% Pulse</text>
        </g>
      </g>
    </g>

    <!-- PulseMatch Social Bar Preview -->
    <g transform="translate(20, 608)">
      <rect width="350" height="74" rx="18" fill="#121829" stroke="#1A2238" stroke-width="1"/>
      <circle cx="36" cy="37" r="22" fill="#8B5CF6"/>
      <text x="26" y="42" fill="#FFFFFF" font-size="13" font-family="Inter, sans-serif" font-weight="700">RF</text>

      <text x="70" y="32" fill="#F8FAFC" font-size="13" font-family="Space Grotesk, sans-serif" font-weight="700">Rafael Ferreira</text>
      <text x="70" y="48" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif">Avaliou 'Duna 2' com 5 estrelas</text>

      <!-- Match pill -->
      <rect x="252" y="25" width="84" height="26" rx="13" fill="#1A2238" stroke="#22D3EE" stroke-width="1"/>
      <text x="264" y="42" fill="#22D3EE" font-size="11" font-family="Inter, sans-serif" font-weight="700">88% Match</text>
    </g>

    <!-- Bottom Navigation Bar (Flutter synced) -->
    <g transform="translate(0, 752)">
      <rect width="390" height="92" fill="#121829" stroke="#1A2238" stroke-width="1"/>
      
      <!-- Nav Item 1: Descobrir (Ativo) -->
      <g transform="translate(24, 12)">
        <rect x="12" y="0" width="46" height="28" rx="14" fill="#1A2238"/>
        <circle cx="35" cy="14" r="7" stroke="#8B5CF6" stroke-width="2" fill="none"/>
        <path d="M35 10L37 14L35 18L33 14Z" fill="#8B5CF6"/>
        <text x="35" y="44" text-anchor="middle" fill="#8B5CF6" font-size="11" font-family="Inter, sans-serif" font-weight="700">Descobrir</text>
      </g>

      <!-- Nav Item 2: Diário -->
      <g transform="translate(118, 12)">
        <rect x="24" y="6" width="16" height="18" rx="3" stroke="#94A3B8" stroke-width="1.8" fill="none"/>
        <path d="M28 11h8M28 15h8M28 19h5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
        <text x="32" y="44" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif" font-weight="500">Diário</text>
      </g>

      <!-- Nav Item 3: Listas -->
      <g transform="translate(212, 12)">
        <path d="M24 8h16M24 14h16M24 20h10" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
        <text x="32" y="44" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif" font-weight="500">Listas</text>
      </g>

      <!-- Nav Item 4: Perfil -->
      <g transform="translate(306, 12)">
        <circle cx="32" cy="12" r="6" stroke="#94A3B8" stroke-width="1.8" fill="none"/>
        <path d="M22 24c0-3.5 4.5-5.5 10-5.5s10 2 10 5.5" stroke="#94A3B8" stroke-width="1.8" fill="none"/>
        <text x="32" y="44" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif" font-weight="500">Perfil</text>
      </g>

      <!-- Home Indicator -->
      <rect x="125" y="78" width="140" height="4" rx="2" fill="#334155"/>
    </g>
  </g>
</svg>
