" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><circle cx="406" cy="606" r="12" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="406" y="610.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="448" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0.3" opacity="1">Decisões de UX</text><line x1="448" y1="130" x2="820" y2="130" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/><circle cx="461" cy="157" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="161.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="484" y="161" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Perfil público e a moeda social</text><text x="484" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">O que a pessoa mostra é o gosto, não a quantidade.</text><text x="484" y="195" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Números existem, mas não dominam a tela.</text><circle cx="461" cy="221" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="225.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="484" y="225" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">PulseMatch explicado, não mágico</text><text x="484" y="244" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Ao lado do percentual vem a razão: em que vocês</text><text x="484" y="259" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">concordam e em que divergem. Um número sem</text><text x="484" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">explicação não gera confiança.</text><circle cx="461" cy="300" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="304.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="484" y="304" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Prova verificável</text><text x="484" y="323" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">'Ver os 41 títulos em comum' permite auditar o</text><text x="484" y="338" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">cálculo. Requisito de transparência do</text><text x="484" y="353" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">diferencial.</text><circle cx="461" cy="379" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="383.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="484" y="383" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Mapa de gosto visual</text><text x="484" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Os gêneros avaliados formam o retrato do perfil e</text><text x="484" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">são a matéria-prima do PulseMatch e das</text><text x="484" y="432" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">recomendações futuras.</text></svg>