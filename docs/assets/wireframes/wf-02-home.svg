t-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="484" y="161" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Busca acima da dobra</text><text x="484" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">A tarefa mais frequente da persona Lucas é achar</text><text x="484" y="195" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">um título que acabou de assistir. A busca é o</text><text x="484" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">primeiro elemento tocável da tela.</text><circle cx="461" cy="236" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="240.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="484" y="240" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">MoodTags como porta de entrada</text><text x="484" y="259" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Responde a dor da Marina: ela não sabe o título,</text><text x="484" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">sabe o humor. Filtrar por sensação vira um caminho</text><text x="484" y="289" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">de descoberta de primeira classe.</text><circle cx="461" cy="315" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="319.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="484" y="319" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Retomada do diário</text><text x="484" y="338" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Card contextual que puxa o usuário para o loop</text><text x="484" y="353" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">principal (assistir - registrar) sem exigir busca.</text><circle cx="461" cy="379" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="383.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="484" y="383" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Prova social com PulseMatch</text><text x="484" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Recomendação de amigo vem com o percentual de</text><text x="484" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">afinidade ao lado: o número explica por que aquilo</text><text x="484" y="432" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">está ali.</text><circle cx="461" cy="458" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="462.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">5</text><text x="484" y="462" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Botão + sempre visível</text><text x="484" y="481" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Registro rápido a um toque de qualquer aba. Meta:</text><text x="484" y="496" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">avaliar em menos de 20 segundos.</text></svg>