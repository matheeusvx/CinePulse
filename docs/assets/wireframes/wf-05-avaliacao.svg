-spacing="0" opacity="1">MoodTags antes do PulseScore</text><text x="484" y="244" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Marcar sensação custa um toque e alimenta a</text><text x="484" y="259" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">descoberta por humor; é o dado opcional de maior</text><text x="484" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">retorno.</text><circle cx="461" cy="300" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="304.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="484" y="304" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Divulgação progressiva</text><text x="484" y="323" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">O PulseScore por critérios fica recolhido. Quem</text><text x="484" y="338" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">quer profundidade abre; quem quer velocidade</text><text x="484" y="353" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">ignora.</text><circle cx="461" cy="379" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="383.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="484" y="383" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Folha, não tela nova</text><text x="484" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">A avaliação acontece por cima do detalhe, mantendo</text><text x="484" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">o contexto do título visível e permitindo desistir</text><text x="484" y="432" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">sem perder o lugar.</text></svg>