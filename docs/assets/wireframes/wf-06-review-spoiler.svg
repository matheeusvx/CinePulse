ap="round"/><circle cx="461" cy="157" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="161.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="484" y="161" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Nota já vem preenchida</text><text x="484" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">A review herda o que foi feito na WF-05. Ninguém</text><text x="484" y="195" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">avalia duas vezes a mesma coisa.</text><circle cx="461" cy="221" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="225.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="484" y="225" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Spoiler e um toque, com consequência explicada</text><text x="484" y="244" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">O texto abaixo do controle diz o que vai</text><text x="484" y="259" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">acontecer. Sinalizar spoiler não pode depender de</text><text x="484" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">o autor adivinhar o comportamento do sistema.</text><circle cx="461" cy="300" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="304.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="484" y="304" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Prévia antes de publicar</text><text x="484" y="323" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Mostra o card fechado como os outros verão. Reduz</text><text x="484" y="338" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">o medo de errar e reforca o contrato do Spoiler</text><text x="484" y="353" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Safe.</text><circle cx="461" cy="379" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="383.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="484" y="383" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Publicar só habilita com texto</text><text x="484" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Botão do topo fica inativo até existir conteúdo,</text><text x="484" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">evitando review vazia no feed.</text></svg>