a, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">Ao continuar você aceita os Termos e a</text><text x="220.0" y="776" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">Política de Privacidade.</text></g><circle cx="406" cy="346" r="12" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="406" y="350.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">1</text><circle cx="406" cy="406" r="12" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="406" y="410.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">2</text><circle cx="406" cy="649" r="12" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="406" y="653.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><circle cx="406" cy="716" r="12" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="406" y="720.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="448" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0.3" opacity="1">Decisões de UX</text><line x1="448" y1="130" x2="820" y2="130" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/><circle cx="461" cy="157" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="161.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="484" y="161" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Cadastro depois do valor</text><text x="484" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">A aba 'Entrar' vem primeiro para quem retorna.</text><text x="484" y="195" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Criar conta é o segundo passo, não o primeiro</text><text x="484" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">obstáculo.</text><circle cx="461" cy="236" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="240.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="484" y="240" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Somente dois campos</text><text x="484" y="259" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">E-mail e senha. Nome, avatar e gêneros favoritos</text><text x="484" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">são pedidos no onboarding pos-login, quando o</text><text x="484" y="289" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">usuário já investiu no fluxo.</text><circle cx="461" cy="315" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="319.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="484" y="319" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Login social</text><text x="484" y="338" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Reduz o atrito de digitar senha no celular,</text><text x="484" y="353" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">principal ponto de abandono em cadastro mobile.</text><circle cx="461" cy="379" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/><text x="461" y="383.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="484" y="383" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Modo explorar</text><text x="484" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Deixa a pessoa navegar catálogo e reviews sem</text><text x="484" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">conta. Salvar, avaliar ou seguir alguém dispara o</text><text x="484" y="432" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">cadastro no contexto certo.</text></svg>