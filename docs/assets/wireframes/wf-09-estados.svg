<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1120" height="760" rx="0" fill="#FFFFFF" stroke="none" opacity="1"/><text x="40" y="46" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="-0.2" opacity="1">Estados de tela  |  vazio, carregando e erro</text><text x="40" y="70" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Um fluxo só está especificado quando os três estados fora do caminho feliz também estão.</text><rect x="40" y="104" width="292" height="32" rx="8" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.4" opacity="1"/><text x="54" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#16A34A" text-anchor="start" letter-spacing="0" opacity="1">Vazio</text><text x="103.0" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Diário sem nenhum registro</text><rect x="40" y="150" width="292" height="520" rx="24" fill="#FFFFFF" stroke="#1F2430" stroke-width="2.2" opacity="1"/><rect x="50" y="160" width="272" height="500" rx="18" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1" opacity="1"/><rect x="154.0" y="166" width="64" height="16" rx="8" fill="#1F2430" stroke="none" opacity="1"/><text x="66" y="220" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Meu diário</text><circle cx="186.0" cy="350" r="44" fill="#F3F5F9" stroke="#C9D0DA" stroke-width="1.6"/><polygon points="186.0,330.0 191.3,342.7 205.0,343.8 194.6,352.8 197.8,366.2 186.0,359.0 174.2,366.2 177.4,352.8 167.0,343.8 180.7,342.7" fill="none" stroke="#C9D0DA" stroke-width="1.2"/><text x="186.0" y="422" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1F2430" text-anchor="middle" letter-spacing="0" opacity="1">Seu diário começa aqui</text><text x="186.0" y="444" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">Registre o último filme ou</text><text x="186.0" y="460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">episódio que você assistiu e o</text><text x="186.0" y="476" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">CinePulse começa a aprender seu</text><text x="186.0" y="492" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">gosto.</text><rect x="90" y="504" width="192" height="42" rx="10" fill="#8B5CF6" stroke="none" opacity="1"/><text x="186.0" y="530.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Registrar o primeiro</text><text x="186.0" y="570" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8B5CF6" text-anchor="middle" letter-spacing="0" opacity="1">ou ver o que está em alta</text><rect x="396" y="104" width="292" height="32" rx="8" fill="#F4F0FE" stroke="#8B5CF6" stroke-width="1.4" opacity="1"/><text x="410" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#8B5CF6" text-anchor="start" letter-spacing="0" opacity="1">Carregando</text><text x="496.0" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Busca aguardando resposta</text><rect x="396" y="150" width="292" height="520" rx="24" fill="#FFFFFF" stroke="#1F2430" stroke-width="2.2" opacity="1"/><rect x="406" y="160" width="272" height="500" rx="18" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1" opacity="1"/><rect x="510.0" y="166" width="64" height="16" rx="8" fill="#1F2430" stroke="none" opacity="1"/><rect x="422" y="204" width="240" height="38" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" opacity="1"/><text x="436" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">duna</text><rect x="422" y="264" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#E5EAF1" stroke-width="1.5" opacity="1"/><rect x="432" y="274" width="40" height="52" rx="6" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="284" width="120" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="302" width="84" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="422" y="348" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#E5EAF1" stroke-width="1.5" opacity="1"/><rect x="432" y="358" width="40" height="52" rx="6" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="368" width="120" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="386" width="84" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="422" y="432" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#E5EAF1" stroke-width="1.5" opacity="1"/><rect x="432" y="442" width="40" height="52" rx="6" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="452" width="120" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="470" width="84" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="422" y="516" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#E5EAF1" stroke-width="1.5" opacity="1"/><rect x="432" y="526" width="40" height="52" rx="6" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="536" width="120" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><rect x="482" y="554" width="84" height="8" rx="4" fill="#E5EAF1" stroke="none" opacity="1"/><text x="542.0" y="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">esqueleto com a forma do resultado</text><rect x="752" y="104" width="292" height="32" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4" opacity="1"/><text x="766" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="start" letter-spacing="0" opacity="1">Erro</text><text x="807.6" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Sem conexão ao buscar</text><rect x="752" y="150" width="292" height="520" rx="24" fill="#FFFFFF" stroke="#1F2430" stroke-width="2.2" opacity="1"/><rect x="762" y="160" width="272" height="500" rx="18" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="1" opacity="1"/><rect x="866.0" y="166" width="64" height="16" rx="8" fill="#1F2430" stroke="none" opacity="1"/><rect x="778" y="204" width="240" height="38" rx="10" fill="#FFFFFF" stroke="#A7AFBD" stroke-width="1.5" opacity="1"/><text x="792" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">duna</text><circle cx="898.0" cy="360" r="38" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/><text x="898.0" y="370" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#DC2626" text-anchor="middle" letter-spacing="0" opacity="1">!</text><text x="898.0" y="434" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1F2430" text-anchor="middle" letter-spacing="0" opacity="1">Não deu para buscar agora</text><text x="898.0" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">Sua conexão caiu. Seus registros</text><text x="898.0" y="472" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">já salvos continuam disponíveis no</text><text x="898.0" y="488" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#6B7484" text-anchor="middle" letter-spacing="0" opacity="1">diário.</text><rect x="802" y="508" width="192" height="42" rx="10" fill="#8B5CF6" stroke="none" opacity="1"/><text x="898.0" y="534.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Tentar de novo</text><text x="898.0" y="574" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8B5CF6" text-anchor="middle" letter-spacing="0" opacity="1">ir para o diário offline</text><line x1="40" y1="706" x2="1080" y2="706" stroke="#E5EAF1" stroke-width="1" stroke-linecap="round"/><text x="40" y="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Vazio nunca é só um aviso</text><text x="40" y="722" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Todo estado vazio explica o valor da tela e</text><text x="40" y="736" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">oferece a ação que sai dali. 'Nenhum item</text><text x="40" y="750" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">encontrado' sozinho é um beco sem saída.</text><text x="396" y="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Carregando tem a forma do conteúdo</text><text x="396" y="722" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Esqueleto no lugar de spinner: o usuário já</text><text x="396" y="736" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">entende o que vai chegar e a espera parece</text><text x="396" y="750" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">menor.</text><text x="752" y="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1F2430" text-anchor="start" letter-spacing="0" opacity="1">Erro diz o que fazer, não o código</text><text x="752" y="722" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">Linguagem humana, causa provável, ação de</text><text x="752" y="736" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">recuperação e uma saída alternativa que não</text><text x="752" y="750" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#6B7484" text-anchor="start" letter-spacing="0" opacity="1">depende de rede.</text></svg>