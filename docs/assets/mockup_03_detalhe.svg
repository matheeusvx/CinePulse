<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <linearGradient id="detailBg" x1="195" y1="0" x2="195" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="35%" stop-color="#090D18"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="backdropGrad" x1="195" y1="0" x2="195" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="pulseBarGrad" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="detailClip">
      <rect width="390" height="844" rx="44"/>
    </clipPath>
  </defs>

  <g clip-path="url(#detailClip)">
    <!-- Base Background -->
    <rect width="390" height="844" fill="url(#detailBg)"/>

    <!-- Backdrop Graphic -->
    <rect width="390" height="230" fill="url(#backdropGrad)"/>
    <!-- Ambient glowing shapes simulating movie scene -->
    <circle cx="280" cy="80" r="90" fill="#F59E0B" opacity="0.2" filter="blur(30px)"/>
    <circle cx="100" cy="110" r="70" fill="#8B5CF6" opacity="0.3" filter="blur(30px)"/>

    <!-- Top Floating Actions (Back, Share) -->
    <g transform="translate(20, 48)">
      <!-- Back button -->
      <circle cx="20" cy="20" r="20" fill="#090D18" fill-opacity="0.65"/>
      <path d="M23 14l-6 6 6 6" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Share / Bookmark -->
      <circle cx="330" cy="20" r="20" fill="#090D18" fill-opacity="0.65"/>
      <path d="M325 15h10v12l-5-3-5 3V15z" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Poster & Main Info Section -->
    <g transform="translate(20, 150)">
      <!-- Poster Card -->
      <rect width="105" height="155" rx="14" fill="#1E1B4B" stroke="#312E81" stroke-width="1.5"/>
      <rect x="8" y="8" width="89" height="139" rx="10" fill="#2D1B69"/>
      <text x="52" y="78" text-anchor="middle" fill="#C4B5FD" font-size="12" font-family="Space Grotesk, sans-serif" font-weight="700">DUNA: 2</text>

      <!-- Title & Metadata -->
      <g transform="translate(120, 24)">
        <text x="0" y="24" fill="#F8FAFC" font-size="22" font-family="Space Grotesk, sans-serif" font-weight="700">Duna: Parte 2</text>
        <text x="0" y="46" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif">2024 • Ficção, Aventura • 2h 46m</text>

        <!-- Rating & Pulse Score community -->
        <g transform="translate(0, 60)">
          <rect width="70" height="26" rx="13" fill="#1A2238" stroke="#FBBF24" stroke-width="0.8"/>
          <text x="12" y="17" fill="#FBBF24" font-size="12" font-family="Inter, sans-serif" font-weight="700">★ 4.8</text>
          
          <rect x="78" y="0" width="82" height="26" rx="13" fill="#1A2238" stroke="#22D3EE" stroke-width="0.8"/>
          <text x="88" y="17" fill="#22D3EE" font-size="11" font-family="Inter, sans-serif" font-weight="700">96% Pulse</text>
        </g>
      </g>
    </g>

    <!-- Quick Action Buttons -->
    <g transform="translate(20, 324)">
      <!-- Watchlist button -->
      <rect width="108" height="40" rx="14" fill="#121829" stroke="#1A2238" stroke-width="1"/>
      <text x="54" y="25" text-anchor="middle" fill="#F8FAFC" font-size="12" font-family="Inter, sans-serif" font-weight="600">+ Watchlist</text>

      <!-- Assistido button -->
      <rect x="118" width="108" height="40" rx="14" fill="#1A2238" stroke="#22D3EE" stroke-width="1.2"/>
      <text x="172" y="25" text-anchor="middle" fill="#22D3EE" font-size="12" font-family="Inter, sans-serif" font-weight="600">✓ Assistido</text>

      <!-- Avaliar CTA Button -->
      <rect x="236" width="114" height="40" rx="14" fill="url(#ctaGrad)"/>
      <text x="293" y="25" text-anchor="middle" fill="#FFFFFF" font-size="12" font-family="Inter, sans-serif" font-weight="700">★ Avaliar</text>
    </g>

    <!-- Synopsis Block -->
    <g transform="translate(20, 382)">
      <text x="0" y="18" fill="#F8FAFC" font-size="15" font-family="Space Grotesk, sans-serif" font-weight="700">Sinopse</text>
      <text x="0" y="40" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif" line-height="1.5">Paul Atreides se une a Chani e aos Fremen enquanto busca</text>
      <text x="0" y="58" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif">vingança contra os conspiradores que destruíram sua família.</text>
    </g>

    <!-- DIFFERENTIAL: PulseScore Breakdown Card -->
    <g transform="translate(20, 466)">
      <rect width="350" height="236" rx="20" fill="#121829" stroke="#1A2238" stroke-width="1"/>
      
      <!-- Card Header -->
      <g transform="translate(18, 24)">
        <circle cx="10" cy="10" r="10" fill="#8B5CF6"/>
        <path d="M6 10h2l1-3 2 6 2-4 1 2h2" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="30" y="15" fill="#F8FAFC" font-size="15" font-family="Space Grotesk, sans-serif" font-weight="700">PulseScore™ da Comunidade</text>
        <text x="312" y="15" text-anchor="end" fill="#22D3EE" font-size="12" font-family="Inter, sans-serif" font-weight="700">9.6 / 10</text>
      </g>

      <!-- Criterion 1: História -->
      <g transform="translate(18, 62)">
        <text x="0" y="12" fill="#F8FAFC" font-size="12" font-family="Inter, sans-serif" font-weight="600">História &amp; Roteiro</text>
        <text x="314" y="12" text-anchor="end" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif">4.8 ★</text>
        <rect y="20" width="314" height="6" rx="3" fill="#1A2238"/>
        <rect y="20" width="300" height="6" rx="3" fill="url(#pulseBarGrad)"/>
      </g>

      <!-- Criterion 2: Atuação -->
      <g transform="translate(18, 102)">
        <text x="0" y="12" fill="#F8FAFC" font-size="12" font-family="Inter, sans-serif" font-weight="600">Atuação &amp; Elenco</text>
        <text x="314" y="12" text-anchor="end" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif">4.9 ★</text>
        <rect y="20" width="314" height="6" rx="3" fill="#1A2238"/>
        <rect y="20" width="308" height="6" rx="3" fill="url(#pulseBarGrad)"/>
      </g>

      <!-- Criterion 3: Visual -->
      <g transform="translate(18, 142)">
        <text x="0" y="12" fill="#F8FAFC" font-size="12" font-family="Inter, sans-serif" font-weight="600">Direção Visual &amp; Fotografia</text>
        <text x="314" y="12" text-anchor="end" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif">5.0 ★</text>
        <rect y="20" width="314" height="6" rx="3" fill="#1A2238"/>
        <rect y="20" width="314" height="6" rx="3" fill="url(#pulseBarGrad)"/>
      </g>

      <!-- Criterion 4: Trilha Sonora -->
      <g transform="translate(18, 182)">
        <text x="0" y="12" fill="#F8FAFC" font-size="12" font-family="Inter, sans-serif" font-weight="600">Trilha Sonora &amp; Som</text>
        <text x="314" y="12" text-anchor="end" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif">4.7 ★</text>
        <rect y="20" width="314" height="6" rx="3" fill="#1A2238"/>
        <rect y="20" width="295" height="6" rx="3" fill="url(#pulseBarGrad)"/>
      </g>
    </g>

    <!-- MoodTags associadas -->
    <g transform="translate(20, 720)">
      <text x="0" y="16" fill="#94A3B8" font-size="12" font-family="Inter, sans-serif" font-weight="600">MoodTags mais votadas:</text>
      <g transform="translate(0, 26)">
        <rect width="84" height="26" rx="13" fill="#1A2238" stroke="#22D3EE" stroke-width="1"/>
        <text x="12" y="17" fill="#22D3EE" font-size="11" font-family="Inter, sans-serif" font-weight="600">⚡ Tenso</text>

        <rect x="92" width="76" height="26" rx="13" fill="#121829" stroke="#1A2238" stroke-width="1"/>
        <text x="104" y="17" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif" font-weight="500">🔥 Épico</text>

        <rect x="176" width="94" height="26" rx="13" fill="#121829" stroke="#1A2238" stroke-width="1"/>
        <text x="188" y="17" fill="#94A3B8" font-size="11" font-family="Inter, sans-serif" font-weight="500">🌌 Imersivo</text>
      </g>
    </g>

    <!-- Home Indicator -->
    <rect x="125" y="828" width="140" height="4" rx="2" fill="#334155"/>
  </g>
</svg>
